<!-- Random post button — picks a random post from the whole site. -->
<button id="random-post-btn" type="button" aria-label="Đọc một bài ngẫu nhiên" title="Đọc một bài ngẫu nhiên">
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="3"/>
    <circle cx="8.5" cy="8.5" r="1.4" fill="currentColor" stroke="none"/>
    <circle cx="15.5" cy="8.5" r="1.4" fill="currentColor" stroke="none"/>
    <circle cx="8.5" cy="15.5" r="1.4" fill="currentColor" stroke="none"/>
    <circle cx="15.5" cy="15.5" r="1.4" fill="currentColor" stroke="none"/>
    <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
  </svg>
</button>

<script>
  window.RANDOM_POST_URLS = [
    {%- assign posts = site.posts -%}
    {%- for post in posts -%}
      "{{ post.url | relative_url }}"{%- unless forloop.last -%},{%- endunless -%}
    {%- endfor -%}
  ];
</script>
