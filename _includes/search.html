{% if site.post_search %}

<div id="beautifuljekyll-search-overlay">
  <div id="search-modal">

    <!-- Input row -->
    <div id="search-input-row">
      <span id="search-input-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </span>
      <input type="text" id="nav-search-input" placeholder="Tìm kiếm bài viết..." autocomplete="off" spellcheck="false">
      <div id="nav-search-exit" title="Đóng (Esc)">✕</div>
    </div>

    <!-- ESC hint -->
    <div id="search-esc-hint">
      Nhấn <kbd>Esc</kbd> để đóng &nbsp;·&nbsp; <kbd>Enter</kbd> để mở bài viết
    </div>

    <!-- Results -->
    <ul id="search-results-container"></ul>

  </div><!-- /#search-modal -->

  <script src="https://unpkg.com/simple-jekyll-search@latest/dest/simple-jekyll-search.min.js"></script>
  <script>
    var searchjson = '[ \
      {% for post in site.posts %} \
        { \
          "title"    : "{% if post.title != "" %}{{ post.title | strip_html | escape }}{% else %}{{ post.excerpt | strip_html | escape | strip }}{%endif%}", \
          "category" : "{{ post.tags | join: \", \" }}", \
          "url"      : "{{ site.baseurl }}{{ post.url }}", \
          "date"     : "{{ post.date | date: "%d/%m/%Y" | default: "" }}" \
        }, \
      {% endfor %} \
      {% for page in site.html_pages %}{% if page.title != "{title}" and page.title != "404 - Page not found" %} \
        { \
          "title"    : "{% if page.title != "" %}{{ page.title | strip_html | escape }}{% else %}{{ page.excerpt | strip_html | escape | strip }}{% endif %}", \
          "category" : "{% if page.tags %}{{ page.tags | join: \", \" }}{% else %}page{% endif %}", \
          "url"      : "{{ site.baseurl }}{{ page.url }}", \
          "date"     : "{{ page.date | date: \"%d/%m/%Y\" | default: \"\" }}" \
        }{% unless forloop.last %},{% endunless %} \
      {% endif %}{% endfor %} \
    ]';
    searchjson = JSON.parse(searchjson);

    var sjs = SimpleJekyllSearch({
      searchInput: document.getElementById('nav-search-input'),
      resultsContainer: document.getElementById('search-results-container'),
      json: searchjson,
      searchResultTemplate: '<li><a href="{url}"><span class="search-result-dot"></span><div class="search-result-body"><div class="search-result-title">{title}</div><div class="search-result-meta"><span class="search-result-date">{date}</span><span class="search-result-tags">{category}</span></div></div></a></li>',
      noResultsText: '<li style="padding:20px 10px;text-align:center;color:#aab0bc;font-size:0.9rem;font-family:Open Sans,sans-serif">Không tìm thấy kết quả nào</li>',
      limit: 8,
      fuzzy: false
    });

    // Format tags into pill spans after each render
    document.getElementById('nav-search-input').addEventListener('input', function() {
      setTimeout(function() {
        document.querySelectorAll('.search-result-tags').forEach(function(el) {
          var raw = el.textContent.trim();
          if (!raw) { el.innerHTML = ''; return; }
          el.innerHTML = raw.split(',').map(function(t) {
            t = t.trim();
            return t ? '<span class="search-result-tag">' + t + '</span>' : '';
          }).join('');
        });
      }, 50);
    });
  </script>
</div>

{% endif %}
