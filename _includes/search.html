{% if site.post_search %}

<div id="beautifuljekyll-search-overlay">
  <div id="search-modal">

    <!-- Input row -->
    <div id="search-input-row">
      <span id="search-input-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </span>
      <input type="text" id="nav-search-input" placeholder="Tìm kiếm bài viết..." autocomplete="off" spellcheck="false">
      <div id="nav-search-exit" title="Đóng (Esc)">✕</div>
    </div>

    <!-- Results -->
    <ul id="search-results-container"></ul>

  </div><!-- /#search-modal -->

  <style>
    .search-result-excerpt {
      font-size: 0.82rem;
      color: #8a909c;
      line-height: 1.45;
      margin-top: 3px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .search-result-excerpt mark {
      background: rgba(0, 138, 255, 0.18);
      color: inherit;
      padding: 0 2px;
      border-radius: 3px;
    }
  </style>

  <script type="module">
    (function () {
      var input = document.getElementById('nav-search-input');
      var container = document.getElementById('search-results-container');
      if (!input || !container) return;

      var LIMIT = 8;
      var pagefindPromise = null;
      var firstUrl = null;

      function getPagefind() {
        if (!pagefindPromise) {
          pagefindPromise = import('/pagefind/pagefind.js').catch(function () { return null; });
        }
        return pagefindPromise;
      }

      function noResults(msg) {
        container.innerHTML =
          '<li style="padding:20px 10px;text-align:center;color:#aab0bc;font-size:0.9rem;' +
          'font-family:Open Sans,sans-serif">' + msg + '</li>';
      }

      function render(items) {
        if (!items.length) { noResults('Không tìm thấy kết quả nào'); firstUrl = null; return; }
        firstUrl = items[0].url;
        container.innerHTML = items.map(function (d) {
          var title = (d.meta && d.meta.title) ? d.meta.title : d.url;
          return '<li><a href="' + d.url + '">' +
            '<span class="search-result-dot"></span>' +
            '<div class="search-result-body">' +
              '<div class="search-result-title">' + title + '</div>' +
              '<div class="search-result-excerpt">' + (d.excerpt || '') + '</div>' +
            '</div></a></li>';
        }).join('');
      }

      var timer = null;
      input.addEventListener('input', function () {
        var query = input.value.trim();
        clearTimeout(timer);
        if (!query) { container.innerHTML = ''; firstUrl = null; return; }
        timer = setTimeout(function () {
          getPagefind().then(function (pf) {
            if (!pf) { noResults('Tìm kiếm chỉ hoạt động trên bản đã xuất bản.'); return; }
            pf.search(query).then(function (search) {
              var slice = search.results.slice(0, LIMIT);
              Promise.all(slice.map(function (r) { return r.data(); })).then(render);
            });
          });
        }, 150);
      });

      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && firstUrl) { window.location.href = firstUrl; }
      });
    })();
  </script>
</div>

{% endif %}
